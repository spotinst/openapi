type: object
title: Ocean Rightsizing Replica Bounds
description: >
  Min/max replica bounds for a workload. Used for both the currently configured and recommended replica ranges. Both bounds are always present and represent valid replica counts; they are never null or zero.
properties:
  min:
    type: integer
    format: int32
    minimum: 1
    description: Minimum replica count. Must be at least 1.
    example: 2
  max:
    type: integer
    format: int32
    minimum: 1
    description: Maximum replica count. Must be at least 1.
    example: 10