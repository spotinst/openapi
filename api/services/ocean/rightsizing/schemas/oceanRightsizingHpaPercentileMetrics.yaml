type: object
title: Ocean Rightsizing HPA Percentile Metrics
description: >
  CPU and memory metrics for a workload at a given percentile.
  Either metric may be omitted when unavailable.
properties:
  cpu:
    type: integer
    format: int32
    description: CPU metric at this percentile.
    example: 25
  memory:
    type: integer
    format: int32
    description: Memory metric at this percentile.
    example: 128
