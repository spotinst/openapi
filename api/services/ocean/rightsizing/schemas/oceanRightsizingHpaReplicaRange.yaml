type: object
title: Ocean Rightsizing HPA Replica Range
description: >
  Replica range for a workload HPA history snapshot. Either bound may be omitted
  when unavailable, including max in a recommended replica range.
properties:
  min:
    type: integer
    format: int32
    description: Minimum replica count.
    example: 1
  max:
    type: integer
    format: int32
    description: Maximum replica count.
    example: 10
