type: object
title: Ocean Rightsizing HPA Recommendation History Item
description: >
  HPA recommendation snapshot for a workload. Fields with no value are omitted.
properties:
  timestamp:
    type: integer
    format: int64
    description: Unix epoch timestamp in milliseconds for this snapshot.
    example: 1788998400000
  currentPodCount:
    type: integer
    format: int32
    description: Current number of pods in the workload.
    example: 2
  currentReplicaRange:
    $ref: "../schemas/oceanRightsizingHpaReplicaRange.yaml"
  recommendedReplicaRange:
    $ref: "../schemas/oceanRightsizingHpaReplicaRange.yaml"
  p10:
    allOf:
      - $ref: "../schemas/oceanRightsizingHpaPercentileMetrics.yaml"
    description: CPU and memory metrics at the 10th percentile.
  p99:
    allOf:
      - $ref: "../schemas/oceanRightsizingHpaPercentileMetrics.yaml"
    description: CPU and memory metrics at the 99th percentile.
