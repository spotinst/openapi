type: object
title: Ocean Rightsizing HPA Recommendation
description: >
  HPA replica recommendation for a single Kubernetes workload. Contains the
  current and recommended min/max replica bounds, along with the timestamp
  of the last update.
properties:
  namespace:
    type: string
    description: Kubernetes namespace of the workload.
    example: prod
  workloadName:
    type: string
    description: Name of the Kubernetes workload.
    example: checkout
  workloadType:
    $ref: "../schemas/oceanRightsizingK8sWorkloadType.yaml"
  currentReplicas:
    $ref: "../schemas/oceanRightsizingReplicaBounds.yaml"
  recommendedReplicas:
    $ref: "../schemas/oceanRightsizingReplicaBounds.yaml"
  updatedAt:
    type: string
    format: date-time
    description: >
      ISO 8601 timestamp indicating when this HPA recommendation was last
      computed or updated.
    example: "2026-04-24T04:55:22.043813"