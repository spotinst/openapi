type: object
title: Ocean AKS Strategy
description: >
  The Ocean AKS Strategy object.
properties:
  shouldUtilizeCommitments:
    type: boolean
    description: |
      Determines whether to utilize any existing Azure Savings Plans or Reserved Instances associated with the subscription for On-Demand VMs.
    example: true
    default: false
  spotPercentage:
    type: integer
    description: >
      Percentage of spot VMs to maintain.
    example: 50
    minimum: 0
    maximum: 100
  fallbackToOd:
    type: boolean
    description: >
      If no spot instance markets are available, enable Ocean to launch on-demand instances instead.
    example: true
  orientation:
    type: string
    description: >
      Set this value to control and manage optimization priorities.
    enum: [ cost, availability ]
    example: cost
    default: cost
  drainingTimeout:
    type: integer
    description: >
      Time in seconds to allow the node to drain before it is terminated.
    example: 600
    minimum: 300
    maximum: 3600
