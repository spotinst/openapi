type: object
description: |
  Set dynamic volume size properties. When using this object, you cannot use `rootVolumeSizeInGb`.
  You must use one or the other. When `dynamicVolumeSize` is configured, `rootVolumeType` is optional and defaults to `pd-standard`.
required:
  - baseSize
  - resource
  - sizePerResourceUnit
properties:
  baseSize:
    type: integer
    minimum: 1
    description: |
      Initial size per volume.
    example: 50
  resource:
    type: string
    enum: [CPU]
    example: "CPU"
  sizePerResourceUnit:
    type: integer
    minimum: 1
    description: |
      Additional size per resource unit (in GB).
      For example: if baseSize=50, and sizePerResourceUnit=20, and an instance with 2 CPU is launched, its disk size will be 90 GB.
    example: 20
