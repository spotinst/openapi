type: object
nullable: true
description: |
  Calculates the boot-disk size for each candidate machine type:
  `baseSize + (vCPU count * sizePerResourceUnit)`.
  For example, with `baseSize` 20 and `sizePerResourceUnit` 10, a 2-vCPU
  candidate receives a 40-GiB boot disk.
  Configure either `rootVolumeSizeInGb` or `dynamicVolumeSize` on a launch
  specification, not both.
required:
  - baseSize
  - resource
  - sizePerResourceUnit
properties:
  baseSize:
    type: integer
    minimum: 1
    description: Base boot-disk size in GiB.
    example: 20
  resource:
    type: string
    enum: [CPU]
    description: Resource used as the multiplier for the dynamic boot-disk size.
    example: CPU
  sizePerResourceUnit:
    type: integer
    minimum: 1
    description: Additional boot-disk size in GiB per resource unit.
    example: 10
