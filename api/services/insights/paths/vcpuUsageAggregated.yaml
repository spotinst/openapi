post:
  summary: "Get Organization Daily VCPU Usage"
  description:
    Get the daily VCPU hours usage of the organization between the input time range.

    The usage is aggregated per day, cloud provider and resource type (Elastigroup or Ocean),
    and is split to spot and on-demand VCPU hours.
    The end date is inclusive.
  operationId: "vcpuUsageAggregated"
  tags:
    - "Insights Service"
  parameters:
    - in: "query"
      name: "accountId"
      example: "act-123abc"
      description: >
        ID of the account associated with your token
      schema:
        type: "string"
      required: false
  requestBody:
    required: true
    content:
      application/json:
        schema:
          allOf:
            - $ref: "../schemas/vcpuUsageAggregatedRequest.yaml"
  responses:
    200:
      $ref: "../responses/vcpuUsageAggregated.yaml"
    400:
      description: "Bad Request"
