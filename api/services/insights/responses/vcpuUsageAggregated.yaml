description: Organization Daily VCPU Usage Response
content:
  application/json:
    schema:
      allOf:
        - type: object
          properties:
            request:
              type: object
              description: >
                Original request properties
              properties:
                id:
                  type: string
                  example: 67582d0c-108b-4ef7-9fdc-d39678a30844
                  description: >
                    Unique ID associated with this request
                url:
                  type: string
                  example: /insights/vcpu/fetch/dailyVcpuUsage/aggregated
                  description: >
                    The URL that was used for the request
                method:
                  type: string
                  example: POST
                  description: >
                    The HTTP **METHOD** used for the request
                timestamp:
                  type: string
                  example: 2026-01-20T08:41:57.516Z
                  description: >
                    When the request was received by Spot
            response:
              type: object
              description: >
                Response package that includes, status, type and any relevant data.
              properties:
                status:
                  type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                      description: >
                        HTTP status code assigned to this response
                    message:
                      type: string
                      example: OK
                      description: >
                        HTTP status message for the respective status code
        - type: object
          properties:
            response:
              type: "object"
              properties:
                kind:
                  type: "string"
                  example: insights:fetchDailyVcpuUsage
                  description: >
                    The data type of each item in the response
                items:
                  type: "array"
                  description: >
                    Array of data objects
                  example:
                    - timestamp: "2026-01-14T00:00:00.000Z"
                      resourceType: EG
                      cloudProvider: AWS
                      spotVcpuHours: 1210.8
                      odVcpuHours: 180.25
                    - timestamp: "2026-01-14T00:00:00.000Z"
                      resourceType: OCEAN
                      cloudProvider: AWS
                      spotVcpuHours: 1348.45
                      odVcpuHours: 215.5
                    - timestamp: "2026-01-14T00:00:00.000Z"
                      resourceType: EG
                      cloudProvider: AZURE
                      spotVcpuHours: 540.6
                      odVcpuHours: 64.4
                    - timestamp: "2026-01-14T00:00:00.000Z"
                      resourceType: OCEAN
                      cloudProvider: AZURE
                      spotVcpuHours: 820.75
                      odVcpuHours: 96.25
                    - timestamp: "2026-01-14T00:00:00.000Z"
                      resourceType: EG
                      cloudProvider: GCP
                      spotVcpuHours: 1340.34
                      odVcpuHours: 200.5
                    - timestamp: "2026-01-14T00:00:00.000Z"
                      resourceType: OCEAN
                      cloudProvider: GCP
                      spotVcpuHours: 960.1
                      odVcpuHours: 120.75
                  items:
                    $ref: "../schemas/vcpuUsageAggregated.yaml"
