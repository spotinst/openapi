type: object
title: insights:fetchDailyVcpuUsage

required:
  - fromDate
  - toDate

properties:
  fromDate:
    type: string
    description: >
      Start date of the range, inclusive. Accepts an ISO-8601 date or a Unix timestamp in seconds.
      Must not be after toDate.
    example: "2026-01-14"
  toDate:
    type: string
    description: >
      End date of the range, inclusive. Accepts an ISO-8601 date or a Unix timestamp in seconds.
      Must not be before fromDate.
    example: "2026-01-14"
