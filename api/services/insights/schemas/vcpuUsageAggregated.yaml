type: object
title: insights:fetchDailyVcpuUsage
example:
  - timestamp: "2026-01-14T00:00:00.000Z"
    resourceType: EG
    cloudProvider: AWS
    spotVcpuHours: 1210.8
    odVcpuHours: 180.25
  - timestamp: "2026-01-14T00:00:00.000Z"
    resourceType: OCEAN
    cloudProvider: AWS
    spotVcpuHours: 1348.45
    odVcpuHours: 215.5
  - timestamp: "2026-01-14T00:00:00.000Z"
    resourceType: EG
    cloudProvider: GCP
    spotVcpuHours: 1340.34
    odVcpuHours: 200.5
  - timestamp: "2026-01-14T00:00:00.000Z"
    resourceType: OCEAN
    cloudProvider: GCP
    spotVcpuHours: 960.1
    odVcpuHours: 120.75
  - timestamp: "2026-01-14T00:00:00.000Z"
    resourceType: EG
    cloudProvider: AZURE
    spotVcpuHours: 540.6
    odVcpuHours: 64.4
  - timestamp: "2026-01-14T00:00:00.000Z"
    resourceType: OCEAN
    cloudProvider: AZURE
    spotVcpuHours: 820.75
    odVcpuHours: 96.25

properties:
  timestamp:
    type: string
    format: date-time
    description: Start of the day (UTC) the usage refers to
    example: "2026-01-14T00:00:00.000Z"
  resourceType:
    type: string
    enum: [EG, OCEAN]
    description: Type of the resource that consumed the VCPU hours
    example: OCEAN
  cloudProvider:
    type: string
    enum: [AWS, GCP, AZURE]
    description: Cloud provider of the usage
    example: AWS
  spotVcpuHours:
    type: number
    format: double
    description: VCPU hours consumed by spot instances
    example: 1348.45
  odVcpuHours:
    type: number
    format: double
    description: VCPU hours consumed by on-demand instances
    example: 215.5
