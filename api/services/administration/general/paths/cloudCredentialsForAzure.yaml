post:
  summary: "Set Credentials for Azure"
  description: "Link a Spot account to an Azure Cloud account. \n
  Provide either a client secret or a PEM-encoded certificate and matching private key. \n
  Set the expiration date when Azure secret expiration enforcement is enabled. Spot can remind you to update credentials before they expire. \n
  If your credentials expire, your Azure subscription will disconnect from Spot and prevent Spot from managing your resources."
  operationId: "OrganizationsAndAccountsSetCloudCredentialsForAzure"
  tags:
    - "Accounts"
  parameters:
    - $ref: "../../../../commons/parameters/accountId.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          allOf:
            - $ref: "../schemas/setCloudCredentialsForAzure.yaml"
  responses:
    200:
      $ref: "../responses/setCloudCredentialsForAzure.yaml"
    400:
      description: "Bad Request"

get:
  summary: "Get Credentials for Azure"
  description: Get Azure credential metadata. Client secrets are masked and PEM certificate contents are never returned.
  operationId: "OrganizationsAndAccountsGetCloudCredentialsForAzure"
  tags:
    - "Accounts"
  parameters:
    - $ref: "../../../../commons/parameters/accountId.yaml"
  responses:
    200:
      $ref: "../responses/getCloudCredentialsForAzure.yaml"
    400:
      description: "Bad Request"
