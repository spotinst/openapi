type: object
description: PEM certificate contents are never returned.
properties:
  clientId:
    type: string
    description: The application ID
    example: 111111111
  tenantId:
    type: string
    description: The directory ID
    example: 1321e1e3123er23
  subscriptionId:
    type: string
    description: The subscription ID
    example: 234r3141131
  clientSecret:
    type: string
    nullable: true
    description: Masked client secret; null when certificate authentication is configured.
    example: abc*************************************
  expirationDate:
    type: string
    format: date-time
    nullable: true
    description: The credentials expiration date, when set.