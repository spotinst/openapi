type: object
required:
  - clientId
  - clientSecret
  - tenantId
properties:
  clientId:
    type: string
    description: Set the application ID
    example: 111111111
  clientSecret:
    type: string
    description: Set the key secret
    example: 32431r2431434132
  tenantId:
    type: string
    description: Set the directory ID
    example: 1321e1e3123er23
