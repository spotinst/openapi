type: object
oneOf:
  - title: Client secret authentication
    type: object
    required:
      - clientId
      - clientSecret
      - tenantId
      - subscriptionId
    properties:
      clientId:
        type: string
        description: Set the application ID
        example: 111111111
      clientSecret:
        type: string
        description: Set the client secret. Do not provide pemCertificate.
        example: 32431r2431434132
      tenantId:
        type: string
        description: Set the directory ID
        example: 1321e1e3123er23
      subscriptionId:
        type: string
        description: Set the subscription ID
        example: 234r3141131
      expirationDate:
        type: string
        format: date-time
        description: Set the credentials expiration date. Required when Azure secret expiration enforcement is enabled.
        example: 2025-12-31T23:59:00.000Z
  - title: PEM certificate authentication
    type: object
    required:
      - clientId
      - pemCertificate
      - tenantId
      - subscriptionId
    properties:
      clientId:
        type: string
        description: Set the application ID
        example: 111111111
      pemCertificate:
        type: string
        description: Provide the PEM-encoded certificate and matching private key. Do not provide clientSecret.
      tenantId:
        type: string
        description: Set the directory ID
        example: 1321e1e3123er23
      subscriptionId:
        type: string
        description: Set the subscription ID
        example: 234r3141131
      expirationDate:
        type: string
        format: date-time
        description: Set the credentials expiration date. Required when Azure secret expiration enforcement is enabled.
        example: 2025-12-31T23:59:00.000Z