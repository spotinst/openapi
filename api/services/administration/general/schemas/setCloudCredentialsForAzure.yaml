type: object
description: Provide exactly one of clientSecret or pemCertificate.
required:
  - clientId
  - tenantId
  - subscriptionId
properties:
  clientId:
    type: string
    description: Set the application ID
    example: 111111111
  clientSecret:
    type: string
    description: Set the key secret
  pemCertificate:
    type: string
    description: Set the pemCertificate
  tenantId:
    type: string
    description: Set the directory ID
    example: 1321e1e3123er23
  subscriptionId:
    type: string
    description: Set the subscription ID
    example: 234r3141131
  expirationDate:
    type: string
    format: date-time
    description: Set the key secret expiration date
    example: 2025-12-31T23:59:00.000Z