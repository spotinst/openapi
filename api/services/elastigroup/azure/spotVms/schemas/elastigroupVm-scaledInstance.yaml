type: object
properties:
  vmName:
    type: string
    example: vm-abc1234
  groupId:
    type: string
    example: sig-123456789
  resourceGroupName:
    type: string
    example: spotinst-azure
  region:
    type: string
    example: eastus
  vmSize:
    type: string
    example: standard_ds1_v2
  lifeCycle:
    type: string
    example: spot
  product:
    type: string
    example: Linux
  privateIp:
    type: string
    example: "10.0.0.1"
  publicIp:
    type: string
    example: "52.23.45.67"
  provisioningState:
    type: string
    example: succeeded
  powerState:
    type: string
    example: running
  licenseType:
    type: string
    description: >
      The license type to use for the launched virtual machine.
      Corresponds to Azure Hybrid Benefit options.
    example: Windows_Server
    enum:
      - Windows_Server
      - Windows_Client
      - RHEL_BYOS
      - SLES_BYOS
  detachedAt:
    type: string
    format: date-time
    example: "2021-01-01T12:00:00.000Z"
  terminatedAt:
    type: string
    format: date-time
    example: "2021-01-01T12:00:00.000Z"
